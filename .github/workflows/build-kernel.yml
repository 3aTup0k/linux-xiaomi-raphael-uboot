# Kernel Compilation Workflow - Runs on Ubuntu 24.04 ARM
name: Kernel Compilation

# Manual trigger with configurable kernel version
on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Kernel version (e.g. 6.18)'
        required: true
        default: '6.18'

# Workflow configuration
jobs:
  build-kernel:
    # Run on Ubuntu 24.04 ARM runner
    runs-on: ubuntu-24.04-arm

    # Permissions needed to create a Release
    permissions:
      contents: write   # Allow creating releases and uploading files
      packages: write   # Allow uploading packages (if needed)

    # Environment variables
    env:
      BUILD_TIMESTAMP: ${{ format('{0}', github.run_id) }}-${{ github.run_number }}

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Install build dependencies
      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential gcc-aarch64-linux-gnu bc flex bison \
          7zip kmod bash cpio binutils tar git wget dpkg libssl-dev \
          libelf-dev python3 rsync debhelper-compat libdw-dev

          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21

      # Set up ccache cache
      - name: Set up ccache
        uses: actions/cache@v3
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-kernel-${{ inputs.kernel_version }}
          restore-keys: |
            ${{ runner.os }}-ccache-kernel-

      # Install and configure ccache
      - name: Install and configure ccache
        run: |
          sudo apt install -y ccache
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=5G" >> $GITHUB_ENV
          echo "PATH=/usr/lib/ccache:$PATH" >> $GITHUB_ENV

      # Compile the kernel
      - name: Compile kernel
        env:
          CCACHE_DIR: ${{ env.CCACHE_DIR }}
          PATH: ${{ env.PATH }}
        run: |
          # Export ccache environment variables
          export CCACHE_DIR="$HOME/.ccache"
          export PATH="/usr/lib/ccache:$PATH"

          # Run the kernel build script
          sudo sh raphael-kernel_build.sh ${{ inputs.kernel_version }}

      # Get build timestamp
      - name: Get build timestamp
        id: get-timestamp
        run: |
          echo "timestamp=$(TZ='Europe/Moscow' date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

      # List build artifacts
      - name: List build artifacts
        run: ls -la *.deb || true

      # Create a GitHub Release and upload artifacts
      - name: Create Release and upload artifacts
        uses: softprops/action-gh-release@v1
        with:
          tag_name: kernel-v${{ inputs.kernel_version }}
          name: "Xiaomi Raphael Linux Kernel v${{ inputs.kernel_version }}"
          body: |
            Xiaomi Raphael Linux Kernel
            - Version: ${{ inputs.kernel_version }}
            - Build time: ${{ steps.get-timestamp.outputs.timestamp }}
            - Build ID: ${{ env.BUILD_TIMESTAMP }}
          draft: false
          prerelease: false
          files: |
            linux-image-xiaomi-raphael.deb
            linux-headers-xiaomi-raphael.deb
            firmware-xiaomi-raphael.deb
            alsa-xiaomi-raphael.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Upload kernel packages as a workflow artifact
      - name: Upload kernel packages as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-packages-v${{ inputs.kernel_version }}
          path: |
            *.deb
